# From the guide's templates/workflows/ci.yml, minus its architecture-current
# job: that job's generator only knows Cloudflare Workers, and this site deploys
# on Cloudflare Pages, so its map would be wrong.
# Job names "tests", "lint" and "typecheck" are required BY NAME by the main
# ruleset. Rename one and rename it there in the same PR.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
          cache: npm
      - run: npm ci
      # Coverage is a signal for the human at review time, NEVER a threshold
      # gate - thresholds breed test theater.
      - run: npm test -- --coverage --coverage.reporter=text-summary | tee /tmp/cov.txt
      - run: |
          {
            echo '## Coverage'
            echo '```'
            cat /tmp/cov.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
